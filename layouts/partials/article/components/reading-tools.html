<div class="reading-tools" role="group" aria-label="阅读辅助" hidden>
    <span class="reading-tools__label">阅读辅助</span>
    <div class="reading-tools__buttons">
        <button type="button" data-reading-option="focus" aria-pressed="false" title="隐藏侧栏，集中阅读正文；Esc 退出">专注模式</button>
        <button type="button" data-reading-option="guide" aria-pressed="false" title="突出当前段落；鼠标指向段落或用 Alt + 上下方向键切换">段落导读</button>
        <button type="button" data-reading-option="bionic" aria-pressed="false" title="加粗英文词首，中文保持原样">英文词首加粗</button>
    </div>
    <span class="reading-tools__status" role="status" aria-live="polite"></span>
</div>
