<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">家庭网络规划示意</title>
  <desc id="desc">互联网经过光猫、主网关与防火墙、网管交换机，连接有线电脑、NAS与家庭服务、AP。AP连接无线电脑与手机、IoT设备和访客设备。本图为规划示意，不代表已部署的网络。</desc>
  <rect width="1000" height="450" rx="16" fill="#f7f9fc"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="36" y="42" font-size="22" font-weight="600" fill="#172b4d">家庭网络规划示意</text>
    <text x="36" y="69" font-size="14" fill="#5e6c84">跨 VLAN 路由暂由主网关承担；实际连线与访问权限需分别验证。</text>
    <g fill="none" stroke="#8294ad" stroke-width="2">
      <path d="M202 124H246M406 124H450M654 124H698"/>
      <path d="M810 154V192H204V224M504 192V224M810 192V224"/>
      <path d="M810 284V316M510 316H910M510 316V344M730 316V344M910 316V344"/>
    </g>
    <g stroke-width="1.5">
      <g fill="#eaf0f8" stroke="#b9c8dc">
        <rect x="42" y="94" width="160" height="60" rx="10"/>
        <rect x="246" y="94" width="160" height="60" rx="10"/>
      </g>
      <g fill="#e4efff" stroke="#8fb4e8">
        <rect x="450" y="94" width="204" height="60" rx="10"/>
        <rect x="698" y="94" width="224" height="60" rx="10"/>
      </g>
      <g fill="#fff" stroke="#b9c8dc">
        <rect x="104" y="224" width="200" height="60" rx="10"/>
        <rect x="394" y="224" width="220" height="60" rx="10"/>
        <rect x="720" y="224" width="180" height="60" rx="10"/>
        <rect x="410" y="344" width="200" height="60" rx="10"/>
        <rect x="650" y="344" width="160" height="60" rx="10"/>
        <rect x="840" y="344" width="140" height="60" rx="10"/>
      </g>
    </g>
    <g text-anchor="middle" dominant-baseline="middle" font-size="18" fill="#172b4d">
      <text x="122" y="124">互联网</text><text x="326" y="124">光猫</text>
      <text x="552" y="124">主网关与防火墙</text><text x="810" y="124">网管交换机</text>
      <text x="204" y="254">有线电脑</text><text x="504" y="254">NAS 与家庭服务</text><text x="810" y="254">AP</text>
      <text x="510" y="374">无线电脑与手机</text><text x="730" y="374">IoT 设备</text><text x="910" y="374">访客设备</text>
    </g>
    <text x="36" y="430" font-size="13" fill="#5e6c84">规划示意，非现网拓扑</text>
  </g>
</svg>
