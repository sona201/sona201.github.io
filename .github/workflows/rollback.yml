name: Blog rollback

on:
  workflow_dispatch:
    inputs:
      deployment_commit:
        description: 'Verified pages-snapshot-* tag, legacy master SHA, or active to recover an interrupted deployment'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  rollback:
    if: >-
      github.repository == 'sona201/sona201.github.io' &&
      github.ref == 'refs/heads/main' &&
      vars.PAGES_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/pages-transaction.yml
    with:
      mode: rollback
      target: ${{ inputs.deployment_commit }}
