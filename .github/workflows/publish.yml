name: Blog publish

on:
  workflow_run:
    workflows: [Blog checks]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed, unlabeled]

permissions:
  contents: write
  actions: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  publish:
    if: >-
      github.repository == 'sona201/sona201.github.io' &&
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/pages-transaction.yml
    with:
      mode: publish
