name: Blog publish

on:
  workflow_run:
    workflows: [Blog checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      cleanup_pr:
        description: 'PR number whose preview authorization should be checked'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  publish:
    if: >-
      github.repository == 'sona201/sona201.github.io' &&
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/pages-transaction.yml
    with:
      mode: publish
