name: Blog Pages transaction

on:
  workflow_call:
    inputs:
      mode:
        description: 'Publish a checked build or restore historical production files'
        required: true
        type: string
      target:
        description: 'Privacy-approved snapshot tag or active for recovery'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  transaction:
    if: >-
      github.repository == 'sona201/sona201.github.io' &&
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      (inputs.mode == 'publish' || (inputs.mode == 'rollback' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: blog-pages-publish
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://sona201.github.io/
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The privileged publisher runs trusted main code only, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Resolve checked build or preview cleanup authority
        if: inputs.mode == 'publish'
        id: context
        run: python3 source/scripts/workflow_context.py prepare --output "$RUNNER_TEMP/publish-context.json"
      - name: Download the exact upstream artifact without extracting
        if: steps.context.outputs.action == 'production' || steps.context.outputs.action == 'preview'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.context.outputs.artifact_name }}
          run-id: ${{ steps.context.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/blog-download
          skip-decompress: true
          digest-mismatch: error
      - name: Validate and extract the checked build
        if: steps.context.outputs.action == 'production' || steps.context.outputs.action == 'preview'
        run: python3 source/scripts/workflow_context.py unpack --download "$RUNNER_TEMP/blog-download" --site "$RUNNER_TEMP/blog-site"
      - name: Prepare a complete immutable site snapshot
        if: inputs.mode == 'rollback' || steps.context.outputs.action != 'skip'
        id: prepare
        env:
          TRANSACTION_MODE: ${{ inputs.mode }}
          PUBLISH_KIND: ${{ steps.context.outputs.action }}
          ROLLBACK_TARGET: ${{ inputs.target }}
        run: |
          if [[ "$TRANSACTION_MODE" == rollback ]]; then
            python3 source/scripts/pages_release.py prepare --work "$RUNNER_TEMP/pages-transaction" \
              --kind rollback --target "$ROLLBACK_TARGET"
          else
            args=()
            if [[ "$PUBLISH_KIND" == production || "$PUBLISH_KIND" == preview ]]; then
              args+=(--site "$RUNNER_TEMP/blog-site")
            fi
            python3 source/scripts/pages_release.py prepare --work "$RUNNER_TEMP/pages-transaction" \
              --kind "$PUBLISH_KIND" --context "$RUNNER_TEMP/publish-context.json" "${args[@]}"
          fi
      - name: Upload candidate Pages artifact
        if: steps.prepare.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-transaction/site
          retention-days: 30
          include-hidden-files: true
      - name: Recheck authorization immediately before deployment
        if: inputs.mode == 'publish' && steps.prepare.outcome == 'success'
        run: python3 source/scripts/workflow_context.py recheck --context "$RUNNER_TEMP/publish-context.json"
      - name: Persist the pending deployment transaction
        if: steps.prepare.outcome == 'success'
        id: begin
        continue-on-error: true
        run: python3 source/scripts/pages_release.py begin --work "$RUNNER_TEMP/pages-transaction"
      - name: Deploy candidate through official GitHub Pages action
        if: steps.begin.outcome == 'success'
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the complete deployed generation and site content
        if: steps.deploy.outcome == 'success'
        id: verify
        timeout-minutes: 10
        continue-on-error: true
        run: python3 source/scripts/pages_release.py verify --work "$RUNNER_TEMP/pages-transaction"
      - name: Commit the verified snapshot as the current baseline
        if: steps.verify.outcome == 'success'
        id: commit
        continue-on-error: true
        run: python3 source/scripts/pages_release.py commit --work "$RUNNER_TEMP/pages-transaction"
      # A failed begin can have persisted pending state before losing its response.
      - name: Quiesce an unsuccessful candidate before recovery
        if: >-
          always() &&
          (steps.begin.outcome == 'success' || steps.begin.outcome == 'failure') &&
          steps.commit.outcome != 'success'
        id: quiesce
        env:
          DEPLOYMENT_STATUS: ${{ steps.deploy.outputs.status }}
          DEPLOYMENT_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          python3 source/scripts/pages_release.py quiesce --work "$RUNNER_TEMP/pages-transaction" \
            --deployment-status "$DEPLOYMENT_STATUS" --deployment-outcome "$DEPLOYMENT_OUTCOME"
      - name: Upload the previous complete site for recovery
        if: always() && steps.quiesce.outcome == 'success' && steps.quiesce.outputs.recovery_needed == 'true'
        id: restore_upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: pages-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-transaction/previous
          retention-days: 30
          include-hidden-files: true
      - name: Restore the previous complete site through GitHub Pages
        if: always() && steps.restore_upload.outcome == 'success'
        id: restore
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: pages-recovery-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the recovered site
        if: always() && steps.restore.outcome == 'success'
        id: restored_verify
        timeout-minutes: 10
        continue-on-error: true
        run: python3 source/scripts/pages_release.py verify --work "$RUNNER_TEMP/pages-transaction" --previous
      - name: Clear the failed transaction only after verified recovery
        if: always() && steps.restored_verify.outcome == 'success'
        run: python3 source/scripts/pages_release.py abort --work "$RUNNER_TEMP/pages-transaction"
      - name: Publication and recovery summary
        if: always() && (steps.prepare.outcome == 'success' || steps.prepare.outcome == 'failure')
        run: python3 source/scripts/pages_release.py summary --work "$RUNNER_TEMP/pages-transaction"
      - name: Report the failed candidate even if recovery succeeded
        if: >-
          always() &&
          (steps.begin.outcome == 'success' || steps.begin.outcome == 'failure') &&
          steps.commit.outcome != 'success'
        run: exit 1
      - name: Plan and apply snapshot retention after verified publication
        if: always() && steps.commit.outcome == 'success'
        id: retention
        continue-on-error: true
        run: |
          python3 source/scripts/pages_retention.py plan --output "$RUNNER_TEMP/pages-retention-plan.json"
          python3 source/scripts/pages_retention.py apply --plan "$RUNNER_TEMP/pages-retention-plan.json"
      - name: Report snapshot maintenance failure without undoing publication
        if: always() && steps.retention.outcome == 'failure'
        run: |
          echo '::warning::The site is verified, but snapshot retention failed. Review this run before retrying maintenance.'
          echo 'Snapshot retention needs attention; the verified site remains published.' >> "$GITHUB_STEP_SUMMARY"
